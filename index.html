<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahashri Business Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="App">

    <h2>Mahashri Business Calculator</h2>

    <br>

    <!-- Normal Calculator -->
    <div class="calculator">

      <h3>Normal Calculator</h3>

      <input type="text" id="normalAmount" placeholder="Enter value">

      <input
        type="text"
        id="normalPercentage"
        class="percentage-input"
        placeholder="Enter percentage">

      <button id="calculateNormal">Calculate</button>

      <p id="normalOutput" class="calc-output"></p>

    </div>

    <br>

    <!-- GST Calculator -->
    <div class="calculator">

      <h3>GST Calculator</h3>

      <input type="text" id="gstAmount" placeholder="Enter amount">

      <input
        type="text"
        id="gstPercentage"
        class="percentage-input"
        placeholder="Enter GST percentage">

      <button id="calculateGST">Calculate</button>

      <p id="gstOutput" class="calc-output"></p>

    </div>

    <br>

    <!-- Percentage Calculator -->
    <div class="calculator percentage-calculator">

      <h3>Percentage Calculator</h3>

      <div class="percentage-input-row">

        <input
          type="text"
          id="percentageFrom"
          placeholder="From">

        <button class="swap-btn" id="swapBtn">
          ⇆ Swap
        </button>

      </div>

      <div class="percentage-input-row">

        <input
          type="text"
          id="percentageTo"
          placeholder="To">

        <button id="calculatePercentageDifference">
          Calculate
        </button>

      </div>

      <p id="percentageResult" class="calc-output"></p>

    </div>

    <br>

    <!-- Discount Calculator -->
    <div class="calculator">

      <h3>Discount Price Calculator</h3>

      <input
        type="text"
        id="originalPrice"
        placeholder="Original Price">

      <input
        type="text"
        id="discountPercentage"
        class="percentage-input"
        placeholder="Discount Percentage">

      <button id="calculateDiscount">Calculate</button>

      <p id="discountOutput" class="calc-output"></p>

    </div>

    <br>

    <!-- Profit Percentage Calculator -->
    <div class="calculator">

      <h3>Profit Percentage Calculator</h3>

      <input
        type="text"
        id="investedAmount"
        placeholder="Invested Amount">

      <input
        type="text"
        id="profitAmount"
        placeholder="Profit Amount">

      <button id="calculateProfit">Calculate</button>

      <p id="profitOutput" class="calc-output"></p>

    </div>


<br>

<!-- Stock Profit Calculator -->
<div class="calculator">

  <h3>📊 Stock Profit Calculator</h3>

  <input
    type="text"
    id="buyPrice"
    placeholder="Buy Price">

  <input
    type="text"
    id="sellPrice"
    placeholder="Sell Price">

  <input
    type="text"
    id="stockQuantity"
    placeholder="Quantity">

  <button id="calculateStockProfit">
    Calculate
  </button>

  <p id="stockProfitOutput" class="calc-output"></p>

</div>




<br>

<!-- SIP Calculator -->
<div class="calculator">

  <h3>💰 SIP Calculator</h3>

  <input
    type="text"
    id="sipMonthlyInvestment"
    placeholder="Monthly Investment">

  <input
    type="text"
    id="sipYears"
    placeholder="Years">

  <input
    type="text"
    id="sipReturn"
    class="percentage-input"
    placeholder="Expected Return %">

  <button id="calculateSIP">
    Calculate
  </button>

  <p id="sipOutput" class="calc-output"></p>

</div>



<!-- SIP Chart -->
<div
  class="sip-chart-container"
  id="sipChartContainer"
  style="display:none;">

  <div class="sip-chart-bar">

    <div
      id="investedBar"
      class="invested-bar"
      title="">
    </div>

    <div
      id="wealthBar"
      class="wealth-bar"
      title="">
    </div>

  </div>

  <div class="chart-labels">

    <div class="label-item">
      <span class="label-color invested-color"></span>
      Invested Amount
    </div>

    <div class="label-item">
      <span class="label-color wealth-color"></span>
      Wealth Gained
    </div>

  </div>

</div>

<br>

<!-- Wealth Calculator -->
<div class="calculator">

  <h3>📈 Wealth Calculator</h3>

  <select id="investmentFrequency">

    <option value="monthly">
      Monthly
    </option>

    <option value="yearly">
      Yearly
    </option>

  </select>

  <input
    type="text"
    id="targetWealth"
    placeholder="Targeted Wealth">

  <input
    type="text"
    id="wealthReturn"
    class="percentage-input"
    placeholder="Expected Return %">

  <input
    type="text"
    id="wealthYears"
    placeholder="Tenure (Years)">

  <select id="adjustInflation">

    <option value="no">
      No
    </option>

    <option value="yes">
      Yes
    </option>

  </select>

  <div id="inflationContainer" style="display:none;">

    <input
      type="text"
      id="inflationRate"
      class="percentage-input"
      placeholder="Inflation Percentage">

  </div>

  <button id="calculateWealth">
    Calculate Wealth
  </button>

  <p id="wealthOutput" class="calc-output"></p>

</div>








  </div>
  
  
  

  <!-- Footer -->
  <div class="footer">

    <p style="margin: 0;">

      Website Designed by:

      <a
        href="https://www.linkedin.com/in/mahashrid/"
        target="_blank"
        rel="noopener noreferrer">

        Mahashri D

      </a>

    </p>

  </div>

  <script src="script.js"></script>

</body>

</html>
